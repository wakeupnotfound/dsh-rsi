<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Border Glow -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.6" />
    </linearGradient>

    <!-- Loop Gradients -->
    <linearGradient id="loopGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="loopGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#3b82f6" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerIris" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#93c5fd" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </radialGradient>

    <!-- Filters for Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="24" result="blur1" />
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGradient)" stroke="url(#borderGlow)" stroke-width="4" />

  <!-- Ambient Background Aura -->
  <circle cx="512" cy="512" r="320" fill="url(#coreGlow)" />

  <!-- Outer Recursive Orbital Spirograph (RSIAgent Multi-Wave Loops) -->
  <g transform="translate(512, 512)" opacity="0.85" filter="url(#softGlow)">
    <!-- 8 Rotated Orbital Ellipses -->
    <ellipse cx="0" cy="0" rx="290" ry="110" fill="none" stroke="url(#loopGrad1)" stroke-width="8" transform="rotate(0)" />
    <ellipse cx="0" cy="0" rx="290" ry="110" fill="none" stroke="url(#loopGrad2)" stroke-width="8" transform="rotate(22.5)" />
    <ellipse cx="0" cy="0" rx="290" ry="110" fill="none" stroke="url(#loopGrad1)" stroke-width="8" transform="rotate(45)" />
    <ellipse cx="0" cy="0" rx="290" ry="110" fill="none" stroke="url(#loopGrad2)" stroke-width="8" transform="rotate(67.5)" />
    <ellipse cx="0" cy="0" rx="290" ry="110" fill="none" stroke="url(#loopGrad1)" stroke-width="8" transform="rotate(90)" />
    <ellipse cx="0" cy="0" rx="290" ry="110" fill="none" stroke="url(#loopGrad2)" stroke-width="8" transform="rotate(112.5)" />
    <ellipse cx="0" cy="0" rx="290" ry="110" fill="none" stroke="url(#loopGrad1)" stroke-width="8" transform="rotate(135)" />
    <ellipse cx="0" cy="0" rx="290" ry="110" fill="none" stroke="url(#loopGrad2)" stroke-width="8" transform="rotate(157.5)" />
  </g>

  <!-- Intermediate Verification Shield Ring -->
  <circle cx="512" cy="512" r="145" fill="#0f172a" stroke="url(#loopGrad1)" stroke-width="10" filter="url(#softGlow)" />

  <!-- The Double-Blind Independent Core (Iris / Truth Prism) -->
  <g filter="url(#intenseGlow)">
    <!-- Outer Glow Ring -->
    <circle cx="512" cy="512" r="95" fill="none" stroke="#60a5fa" stroke-width="6" stroke-dasharray="16 8" />
    
    <!-- Core Sphere -->
    <circle cx="512" cy="512" r="70" fill="url(#centerIris)" />
    
    <!-- Central Aperture (Zero-History Blank Witness) -->
    <circle cx="512" cy="512" r="32" fill="#0b0f19" stroke="#93c5fd" stroke-width="5" />
    
    <!-- Reflection Highlights -->
    <circle cx="496" cy="496" r="12" fill="#ffffff" opacity="0.8" />
  </g>
</svg>